[package]
name = "codex-meter"
version = "1.0.0"
description = "A native-feeling menu bar and desktop widget for local Codex usage."
authors = ["Codex Meter contributors"]
edition = "2024"

[lib]
name = "codex_meter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2.5.1"
